<div class="window" id="win">
  <div class="title"><span>🕵️ 雷區內鬼 — 多人找叛徒踩地雷（試玩原型）</span><div class="tb"><div class="tbtn">_</div><div class="tbtn">□</div><div class="tbtn">✕</div></div></div>

</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基本常數（沿用 3D 踩地雷） ================= */
const $ = id => document.getElementById(id);
const BH = 0.36, BEV = 0.09, MAXN = 480;
const NUMC = [null,'#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];
const isTouch = matchMedia('(pointer:coarse)').matches;
const EL = THREE.MathUtils.degToRad(63);           // 預設俯視角（與水平夾角）
const rnd = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
let now = performance.now()/1000;

/* ================= LED 七段顯示 ================= */
const SEG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
function buildLED(el){ el.innerHTML=''; for(let k=0;k<3;k++){ const d=document.createElement('div'); d.className='dg'; for(const s of 'abcdefg'){ const e=document.createElement('i'); e.className=s; d.appendChild(e);} el.appendChild(d);} }
function setLED(el,n){
  n=Math.max(-99,Math.min(999,n|0));
  const s = n<0 ? '-'+String(-n).padStart(2,'0') : String(n).padStart(3,'0');
  [...el.children].forEach((d,k)=>{ const on=SEG[s[k]]||''; [...d.children].forEach(e=>e.classList.toggle('on',on.includes(e.className.replace(' on','')))); });
}
const minesEl=$('mines'), timerEl=$('timer'), faceEl=$('face');
buildLED(minesEl); buildLED(timerEl);
const setFace = f => { if(faceEl.textContent!==f) faceEl.textContent=f; };

/* ================= 音效（WebAudio 合成，沿用並擴充） ================= */
const Snd={ ctx:null, master:null, noise:null, last:0, muted: localStorage.getItem('ms3d_muted')==='1',
  get(){
    if(this.muted) return null;
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      const c=this.ctx=new AC();
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=8;
      this.master=c.createGain(); this.master.gain.value=0.85; this.master.connect(comp); comp.connect(c.destination);
      const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noise=b;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  boom(p){
    const c=this.get(); if(!c) return; const t=c.currentTime;
    if(p<0.8){ if(t-this.last<0.06) return; this.last=t; }
    const dur=0.45+1.7*p, vol=0.3+0.7*p;
    const n=c.createBufferSource(); n.buffer=this.noise; n.loop=true; n.playbackRate.value=p>0.8?0.7:1.1;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.7;
    lp.frequency.setValueAtTime(1800+3500*p,t); lp.frequency.exponentialRampToValueAtTime(90,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    n.connect(lp).connect(g).connect(this.master); n.start(t,Math.random()); n.stop(t+dur+0.05);
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(p>0.8?95:150,t); o.frequency.exponentialRampToValueAtTime(p>0.8?26:45,t+0.25+0.8*p);
    const og=c.createGain(); og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.2+0.9*p,t+0.012); og.gain.exponentialRampToValueAtTime(0.0001,t+0.35+1.2*p);
    o.connect(og).connect(this.master); o.start(t); o.stop(t+1.8);
    if(p>0.8){ // 碎裂劈啪聲
      for(let k=0;k<6;k++){ const s=c.createBufferSource(); s.buffer=this.noise; const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500+Math.random()*2500;
        const sg=c.createGain(); const st=t+0.08+Math.random()*0.6; sg.gain.setValueAtTime(0.0001,st); sg.gain.exponentialRampToValueAtTime(0.25,st+0.004); sg.gain.exponentialRampToValueAtTime(0.0001,st+0.05+Math.random()*0.06);
        s.connect(hp).connect(sg).connect(this.master); s.start(st,Math.random()); s.stop(st+0.15); }
    }
  },
  tick(){ const c=this.get(); if(!c) return; const t=c.currentTime; const s=c.createBufferSource(); s.buffer=this.noise; const hp=c.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=2200; hp.Q.value=1.5;
    const g=c.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035); s.connect(hp).connect(g).connect(this.master); s.start(t,Math.random()); s.stop(t+0.05); },
  flag(on){ const c=this.get(); if(!c) return; const t=c.currentTime; const o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(on?660:520,t); o.frequency.exponentialRampToValueAtTime(on?990:330,t+0.07);
    const g=c.createGain(); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.1); o.connect(g).connect(this.master); o.start(t); o.stop(t+0.12); },
  win(){ const c=this.get(); if(!c) return; const t=c.currentTime; [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,k)=>{ const o=c.createOscillator(); o.type='square'; o.frequency.value=f;
    const g=c.createGain(); const st=t+k*0.11, d=k===5?0.6:0.1; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.09,st+0.01); g.gain.exponentialRampToValueAtTime(0.0001,st+d);
    o.connect(g).connect(this.master); o.start(st); o.stop(st+d+0.02); }); }
};
Object.assign(Snd,{
  alarm(){ const c=this.get(); if(!c) return; const t=c.currentTime;
    for(let k=0;k<3;k++){ const o=c.createOscillator(); o.type='sawtooth'; const st=t+k*0.48;
      o.frequency.setValueAtTime(540,st); o.frequency.linearRampToValueAtTime(900,st+0.24); o.frequency.linearRampToValueAtTime(540,st+0.46);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.07,st+0.02); g.gain.setValueAtTime(0.07,st+0.42); g.gain.exponentialRampToValueAtTime(0.0001,st+0.47);
      o.connect(g).connect(this.master); o.start(st); o.stop(st+0.5); } },

/* ================= 每幀更新（沿用） ================= */
function updDebris(dt){
  let alive=0;
  for(let i=0;i<DCAP;i++){
    if(D.life[i]<=0) continue;
    D.age[i]+=dt; const i3=i*3;
    if(D.age[i]>=D.life[i]){ D.life[i]=0; debris.setMatrixAt(i,ZERO); continue; }
    alive++;
    D.v[i3+1]-=22*dt; D.p[i3]+=D.v[i3]*dt; D.p[i3+1]+=D.v[i3+1]*dt; D.p[i3+2]+=D.v[i3+2]*dt;
    const hh=D.s[i3+1]*0.5, gy=groundAt(D.p[i3],D.p[i3+2]);
    if(D.p[i3+1]-hh<gy && D.p[i3+1]-hh>gy-0.3){ D.p[i3+1]=gy+hh; if(D.v[i3+1]<0) D.v[i3+1]*=-0.32; D.v[i3]*=0.72; D.v[i3+2]*=0.72; D.w[i3]*=0.7; D.w[i3+1]*=0.7; D.w[i3+2]*=0.7; }
    if(D.p[i3+1]<-0.52+hh){ D.p[i3+1]=-0.52+hh; D.v[i3+1]=Math.abs(D.v[i3+1])*0.3; D.v[i3]*=0.7; D.v[i3+2]*=0.7; }
    D.r[i3]+=D.w[i3]*dt; D.r[i3+1]+=D.w[i3+1]*dt; D.r[i3+2]+=D.w[i3+2]*dt;
    if(D.flame[i] && D.age[i]<1.1 && Math.random()<dt*35){
      fire.spawn(D.p[i3],D.p[i3+1],D.p[i3+2],0,0.4,0,rnd(0.25,0.45),0.35,0.12,[1,0.75,0.3],[0.8,0.2,0.02],0.8,1,1);
      smoke.spawn(D.p[i3],D.p[i3+1],D.p[i3+2],rnd(-0.2,0.2),0.6,rnd(-0.2,0.2),rnd(0.8,1.4),0.25,0.9,[0.25,0.22,0.2],[0.4,0.39,0.38],0.4,1,0.6,0,0.1);
    }
    const sh=Math.min(1,(D.life[i]-D.age[i])/0.5);
    _e.set(D.r[i3],D.r[i3+1],D.r[i3+2]); _q.setFromEuler(_e); _p.set(D.p[i3],D.p[i3+1],D.p[i3+2]); _s.set(D.s[i3]*sh,D.s[i3+1]*sh,D.s[i3+2]*sh);
    _m.compose(_p,_q,_s); debris.setMatrixAt(i,_m);
  }
  if(alive||D.alive) debris.instanceMatrix.needsUpdate=true;
  const was=D.alive; D.alive=alive; return alive>0||was>0;
}
function updConfetti(dt){
  let alive=0;
  for(let i=0;i<KCAP;i++){
    if(K.life[i]<=0) continue;
    K.age[i]+=dt; const i3=i*3;
    if(K.age[i]>=K.life[i]){ K.life[i]=0; confetti.setMatrixAt(i,ZERO); continue; }
    alive++;
    const k=Math.exp(-2.2*dt); K.v[i3]*=k; K.v[i3+2]*=k; K.v[i3+1]=K.v[i3+1]*Math.exp(-1.4*dt)-9*dt; if(K.v[i3+1]<-2.2) K.v[i3+1]=-2.2;
    const fl=Math.sin(K.age[i]*5+K.ph[i])*0.9;
    K.p[i3]+=(K.v[i3]+fl)*dt; K.p[i3+1]+=K.v[i3+1]*dt; K.p[i3+2]+=(K.v[i3+2]+fl*0.6)*dt;
    const gy=groundAt(K.p[i3],K.p[i3+2])+0.01; let resting=false;

const raycaster=new THREE.Raycaster(), _ndc=new THREE.Vector2(), _t=new THREE.Vector3(), plane0=new THREE.Plane(new THREE.Vector3(0,1,0),0), _box=new THREE.Box3(), _hit=new THREE.Vector3();

  const hx=C/2+0.65, hz=R/2+0.65, corners=[];
  for(const x of [-hx,hx]) for(const z of [-hz,hz]) for(const y of [-0.1,0.55]) corners.push(new THREE.Vector3(x,y,z));
  const tgt=new THREE.Vector3(); let dist=20;
  const fits=d=>{ placeCamera(tgt,d,view.baseAz,EL); for(const c of corners){ _v.copy(c).project(camera); if(Math.abs(_v.x)>0.965||Math.abs(_v.y)>0.955||_v.z>1||_v.z<-1) return false; } return true; };
  for(let it=0;it<4;it++){
    let lo=1,hi=400; for(let k=0;k<32;k++){ const mid=(lo+hi)/2; if(fits(mid)) hi=mid; else lo=mid; } dist=hi;
    if(it===3) break;
    placeCamera(tgt,dist,view.baseAz,EL);
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const c of corners){ _v.copy(c).project(camera); x0=Math.min(x0,_v.x); x1=Math.max(x1,_v.x); y0=Math.min(y0,_v.y); y1=Math.max(y1,_v.y); }

function groundHit(cx,cy){ raycaster.setFromCamera(clientToNdc(cx,cy),camera); const h=new THREE.Vector3(); return raycaster.ray.intersectPlane(plane0,h)?h:null; }

  raycaster.setFromCamera(clientToNdc(cx,cy),camera); const ray=raycaster.ray; let best=null,bd=1e9;
  for(const c of cells){ const top=c.open?0.01:BH; _box.min.set(c.x-0.5,-0.1,c.z-0.5); _box.max.set(c.x+0.5,top,c.z+0.5);

/* ---- 回合流程 ---- */
function beginTurn(){
  G.phase='pass'; restoreFace(); G.barText='等待下一位玩家接手裝置…'; renderBar(); renderPlayers(); renderHUD();
  showPass(G.cur,`第 ${G.round} 輪・輪到你的回合`,()=>{ hideOv(); enterSecret(); });
}
function enterSecret(){
  G.phase='secret'; G.secretMode=null; G.sel=null; G.secretInfo='';
  restoreFace(); renderBar(); renderPlayers(); renderHUD();
  setMsg('🔒 秘密階段：每個人都有這一步。可使用秘密能力（不佔用動作），完成後按「結束秘密階段」。');
  startCountdown(CFG.secretSec,()=>endSecret());
}
function endSecret(){
  if(G.phase!=='secret') return;
  secretG.clear(); selG.clear(); closeModal(); markDirty();
  G.secretMode=null; G.sel=null; G.secretInfo=''; G.phase='action'; G.tool='reveal';
  restoreFace(); renderBar(); renderHUD();
  setMsg(`▶ ${esc(players[G.cur].name)}：選一個工具再點格子（右鍵 / 長按＝插旗；點數字＝快速翻開周圍）。`);
  startCountdown(CFG.turnSec,()=>{ if(G.phase!=='action') return; addLog(G.cur,'⏱ 時間到，自動跳過','act'); afterAction({}); });
}
function fail(msg){ setMsg(`<span class="warn">⚠ ${msg}</span>`); return false; }
function revealMany(pi,list){
  const op=[], booms=[];
  for(const st of list){
    if(st.open||st.flag) continue;
    if(st.mine){ explodeCell(st,pi); booms.push(st); continue; }
    const q=[[st,0]]; let qi=0;
    while(qi<q.length){
      const [x,d]=q[qi++]; if(x.open||x.flag) continue;
      x.open=true; opened++; op.push(x); if(x.mark) removeMark(x);
      hist(x,pi,x===st?'翻開這格':`被連鎖翻開（來自 ${cn(st)}）`);
      visOpen(x,Math.min(d*24,650));
      if(!x.n) for(const y of nb(x)) if(!y.open&&!y.flag) q.push([y,d+1]);
    }
  }
  if(op.length) Snd.tick();
  return {opened:op,booms};
}
function explodeCell(cell,pi){
  const ti=traitorIdx();
  if(pi>=0&&pi!==ti&&((cell.mark&&cell.mark.type==='safe'&&cell.mark.by===ti)||cell.hist.some(h=>h.swapFrom))) G.misled++;
  cell.open=true; cell.exploded=true; if(cell.mark) removeMark(cell);
  vHidden[cell.i]=1; updBlock(cell.i); tiles.setColorAt(cell.i,COL.red); tiles.instanceColor.needsUpdate=true;
  addMine(cell); explode(cell.x,cell.z,1); addRedMark(cell);
  G.shields=Math.max(0,G.shields-1); if(pi>=0) players[pi].booms++;
  G.explosions.push({pi,i:cell.i,round:G.round});
  hist(cell,pi,'💥 翻到地雷爆炸');
}
function tryReveal(pi,cell){
  if(cell.exploded) return {err:'這格已經爆炸過了'};
  if(cell.flag) return {err:'這格插了旗子，要先拔旗才能翻開'};
  if(cell.open){
    if(!cell.n) return {err:'這格已經翻開了'};
    const ns=nb(cell), f=ns.filter(x=>x.flag||x.exploded).length, tg=ns.filter(x=>!x.open&&!x.flag);
    if(f!==cell.n) return {err:`周圍旗子數（${f}）跟數字（${cell.n}）不同，不能快速翻開`};
    if(!tg.length) return {err:'周圍已經沒有可以翻的格子'};
    const r=revealMany(pi,tg); r.text=`快速翻開 ${cn(cell)} 周圍（${r.opened.length+r.booms.length} 格）`; return r;
  }
  if(!started) placeMines(cell);
  const r=revealMany(pi,[cell]); r.text=r.opened.length>1?`翻開 ${cn(cell)}（連鎖翻開 ${r.opened.length} 格）`:`翻開 ${cn(cell)}`; return r;
}
function toggleFlagBy(pi,cell){
  if(cell.flag){ cell.flag=false; flags--; removeFlag(cell); Snd.flag(false); hist(cell,pi,'拔掉旗子'); addLog(pi,`拔掉 ${cn(cell)} 的旗子`,'act',[cell]); }
  else { if(cell.mark) removeMark(cell); cell.flag=true; cell.flagBy=pi; flags++; addFlag(cell,'place',0); Snd.flag(true); hist(cell,pi,'插旗 🚩'); addLog(pi,`在 ${cn(cell)} 插旗 🚩`,'act',[cell]); }
  updLEDs();
}
function onCellTap(cell,kind){
  if(!G||!cell) return;
  if(G.phase==='secret') return secretTap(cell);
  if(G.phase==='action') return doPublic(kind==='flag'?'flag':G.tool,cell);
  if(G.phase==='sprint') return sprintTap(cell,kind==='flag'?'flag':G.tool);
}
function doPublic(type,cell){
  if(G.phase!=='action') return;
  const pi=G.cur; let res={opened:[],booms:[]};
  if(type==='reveal'){ const r=tryReveal(pi,cell); if(r.err) return fail(r.err); res=r;
    let t=r.text; if(r.booms.length) t+=` 💥 <b class="warn">踩到地雷！防爆盾 -${r.booms.length}（剩 ${G.shields}）</b>`;
    addLog(pi,t,r.booms.length?'boom':'act',[cell,...r.booms.filter(b=>b!==cell)]); }
  else if(type==='flag'){ if(cell.open) return fail('已翻開的格子不能插旗'); toggleFlagBy(pi,cell); }
  else if(type==='safe'||type==='mine'){
    if(cell.open) return fail('已翻開的格子不用標記'); if(cell.flag) return fail('插了旗的格子不能再標記');
    const lab=type==='safe'?'「我覺得安全 ✓」':'「我覺得是雷 ❗」';
    if(cell.mark&&cell.mark.by===pi&&cell.mark.type===type){ removeMark(cell); hist(cell,pi,'取消標記'); addLog(pi,`取消 ${cn(cell)} 的標記`,'act',[cell]); }
    else { setMark(cell,type,pi); hist(cell,pi,'標記'+lab); addLog(pi,`標記 ${cn(cell)} ${lab}`,'act',[cell]); Snd.flag(true); }
  }
  else if(type==='skip'){ addLog(pi,'跳過這回合','act'); }
  else return;
  afterAction(res);
}
function afterAction(res){
  stopCountdown(); updLEDs(); renderShields(); setHover(-1);
  if(res.booms&&res.booms.length){
    G.phase='boom'; restoreFace(); G.barText=`💥 爆炸了！防爆盾剩 ${G.shields} 個…`; renderBar(); renderHUD();
    setMsg(`💥 ${esc(players[G.cur].name)} 踩到地雷！${G.shields>0?'準備開會…':''}`);
    gLater(2700,()=>{ if(G.shields<=0) endGame('traitor','防爆盾歸零，隊伍被炸光了！'); else startMeeting({type:'boom',by:G.cur,cells:res.booms.map(c=>c.i)}); });
    return;
  }
  if(opened===R*C-M){ endGame('sweepers','雷區清完了！叛徒還沒被抓到，但他的破壞沒有成功。'); return; }
  G.phase='after'; G.barText=`✔ ${esc(players[G.cur].name)} 的回合結束，準備交給下一位…`; renderBar(); renderHUD();
  gLater(1400,endTurn);
}
function endTurn(){
  if(!G||!['after','voteResult'].includes(G.phase)) return;
  const n=players.length; let j=G.cur, wrapped=false;
  for(let k=1;k<=n;k++){ const idx=(G.cur+k)%n; if(G.cur+k>=n) wrapped=true; if(players[idx].alive){ j=idx; break; } }
  if(wrapped){ applyPendingSwap(); G.round++; addLog(-1,`— 第 ${G.round} 輪開始 —`,'sys'); }
  G.cur=j; beginTurn();
}

/* ---- 秘密階段：能力 ---- */
function secretTap(cell){
  const m=G.secretMode;
  if(!m){ setMsg('🔒 秘密階段：先選一個能力，或按「結束秘密階段」再行動。'); return; }
  if(m==='radar'){ G.sel=cell; showSel(around(cell),'y'); }
  else if(m==='swapFrom'||(m==='swapTo'&&cell.flag&&cell!==(G.sel&&G.sel.from))){
    if(!cell.flag) return fail('請點一面旗子');
    const cand=nb(cell).filter(okSwapTarget); if(!cand.length) return fail('這面旗子旁邊沒有可以移過去的空格');
    G.sel={from:cell,to:null}; G.secretMode='swapTo'; showSel([cell],'y'); showSel(cand,'g',true);
  }
  else if(m==='swapTo'){
    if(!nb(G.sel.from).includes(cell)||!okSwapTarget(cell)) return fail('只能移到旗子相鄰、還沒翻開也沒插旗的格子');
    G.sel.to=cell; showSel([G.sel.from],'y'); showSel([cell],'g',true);
  }
  else if(m==='replay'){ G.sel=cell; showSel([cell],'y'); }
  renderBar();
}
function doRadar(center){
  const area=around(center); secretG.clear();
  const mines=area.filter(x=>x.mine&&!x.open);
  for(const x of area){ if(x.open) continue; const m=new THREE.Mesh(radarGeo,x.mine?radarMineMat:radarSafeMat); m.position.set(x.x,BH+0.03,x.z); m.renderOrder=3; secretG.add(m); }
  showSel(area,'y');
  G.radarReady=G.round+3; G.radarMem.push({round:G.round,center:cn(center),mines:mines.map(cn)});
  area.forEach(x=>hist(x,-1,`📡 這格曾被雷達掃描（第 ${G.round} 輪）`,true));
  addLog(G.cur,`📡 用雷達掃描 ${cn(center)} 周圍 3×3（看到 ${mines.length} 顆雷）`,'secret',[center],true);
  G.secretMode=null; G.sel=null; Snd.whoosh();
  G.secretInfo=`📡 雷達結果：紅＝雷、綠＝安全（${mines.length?'雷在 '+mines.map(cn).join('、'):'這塊沒有雷'}）。記好後按「結束秘密階段」，標示會消失。`;
  markDirty();
}
function doSwap(){
  const {from,to}=G.sel; G.pendingSwap={from:from.i,to:to.i,pi:G.cur,round:G.round}; G.swapAvail=false;
  addLog(G.cur,`🔀 預約把 ${cn(from)} 的旗子移到 ${cn(to)}（本輪結束時生效）`,'secret',[from,to],true);
  G.secretMode=null; G.sel=null; selG.clear(); Snd.whoosh();
  G.secretInfo=`🔀 已預約：${cn(from)} 的旗子會在本輪結束時移到 ${cn(to)}（不會公告是誰移的）。`;
}
function applyPendingSwap(){
  const p=G.pendingSwap; if(!p) return; G.pendingSwap=null;
  const from=cells[p.from], to=cells[p.to];
  if(from.flag&&!to.open&&!to.flag){
    from.flag=false; removeFlag(from); to.flag=true; to.flagBy=from.flagBy; if(to.mark) removeMark(to); addFlag(to,'place',0);
    hist(from,p.pi,`🔀 這格的旗子被移到 ${cn(to)}`,true,{swapFrom:true}); hist(to,p.pi,`🔀 旗子從 ${cn(from)} 被移到這格`,true,{swapTo:true});
    addLog(p.pi,`🔀 偷換旗生效：${cn(from)} → ${cn(to)}`,'secret',[from,to],true);
  } else { G.swapAvail=true; addLog(p.pi,`🔀 偷換旗失效（${cn(from)} 或 ${cn(to)} 狀態已改變），次數退回`,'secret',[from,to],true); }
}
function doReplay(cell){
  const p=players[G.cur]; p.replayUsed=true;
  const ti=traitorIdx();
  if(cell.hist.some(h=>h.secret&&h.who===ti)) p.replayHit=true;
  addLog(G.cur,`🎞 回放調查 ${cn(cell)}`,'secret',[cell],true);
  G.secretMode=null; G.sel=null;
  const st=cell.exploded?'💥 已爆炸（雷）':cell.open?'已翻開':cell.flag?'🚩 插旗中':'未翻開';
  const who=h=>{
    if(!h.secret||h.who===-1) return h.who!==-1?pn(h.who)+'：':'';
    if(h.decoy===undefined||h.decoy===G.cur){ const pool=players.map((_,i)=>i).filter(i=>i!==h.who&&i!==G.cur); h.decoy=pool.length?pool[Math.floor(Math.random()*pool.length)]:-1; }
    if(h.decoy<0) return '嫌疑人：（無法判斷）：';
    const pair=Math.random()<0.5?[h.who,h.decoy]:[h.decoy,h.who];
    return `嫌疑人：${pn(pair[0])} 或 ${pn(pair[1])}（其中一人）：`;
  };
  const rows=cell.hist.length?cell.hist.map(h=>`<div class="le${h.secret?' secret':''}"><span class="rd">第${h.round}輪</span> ${who(h)}${h.text}${h.secret?' <b class="warn">（秘密動作痕跡）</b>':''}</div>`).join(''):'<div class="le">這格到目前為止沒有任何人動過。</div>';
  modal(dlg(`🎞 回放調查：${cn(cell)}`,`<p>目前狀態：<b>${st}</b>　（這是你整場唯一一次回放調查，只有你看得到）</p>
    <div class="panel" style="max-height:50vh">${rows}</div><p class="small">要不要在會議上公開、公開多少，由你決定。</p>
    <div class="row c"><button class="btn big" id="rpClose">關閉</button></div>`));
  $('rpClose').onclick=()=>{ closeModal(); selG.clear(); markDirty(); renderBar(); };
  G.secretInfo=`🎞 已查看 ${cn(cell)} 的紀錄。`;
}
function openNotes(){
  const p=players[G.cur];
  const opts=players.map((q,i)=>i===G.cur?'':`<button class="btn" data-s="${i}" style="${p.suspect===i?'background:#ffd':''}"><span class="dot" style="background:${q.color}"></span> ${esc(q.name)}${q.alive?'':'（出局）'}</button>`).join('');

function openIdentity(pi){

/* ---- 下方操作列 ---- */
const TOOLS=[['reveal','🔍 翻開'],['flag','🚩 插旗/拔旗'],['safe','✅ 標記安全'],['mine','❗ 標記是雷']];
function renderBar(){
  const b=$('bar'); if(!G){ b.className='sunken'; b.innerHTML=''; return; }
  const ph=G.phase, p=players[G.cur]; let h='';
  b.className='sunken'+(ph==='secret'?' priv':'');
  if(ph==='secret'){
    h+=`<div class="hd">🔒 秘密階段 — 只有 ${esc(p.name)} 能看（每個人的回合都有這一步）</div><div class="row">`;
    const m=G.secretMode;
    if(m){
      if(m==='radar') h+=`<span class="prompt">📡 點盤面一格作為 3×3 掃描中心</span>${G.sel?`<button class="btn" data-a="radarGo"><b>確定掃描 ${cn(G.sel)}</b></button>`:''}`;
      else if(m==='swapFrom') h+=`<span class="prompt">🔀 點一面要偷偷移動的旗子</span>`;
      else if(m==='swapTo') h+=`<span class="prompt">🔀 點旗子 ${cn(G.sel.from)} 旁邊的綠框格子</span>${G.sel.to?`<button class="btn" data-a="swapGo"><b>確定：${cn(G.sel.from)} → ${cn(G.sel.to)}</b></button>`:''}`;
      else if(m==='replay') h+=`<span class="prompt">🎞 點一格查看它的完整紀錄（整場只能用 1 次）</span>${G.sel?`<button class="btn" data-a="replayGo"><b>確定查看 ${cn(G.sel)}</b></button>`:''}`;
      h+=`<button class="btn" data-a="cancel">取消</button>`;
    } else {
      if(p.role==='traitor'){
        const rOk=started&&G.round>=G.radarReady;

/* ---- 結局：派對模式 / 挑戰模式 ---- */
function partyFinale(){
  G.phase='finale'; G.barText='🎉 派對模式：叛徒被抓到了！大家合力把雷區清完…'; renderBar(); renderHUD(); renderPlayers(); setMsg('🎉 派對模式：大家合力清完雷區！');
  if(!started) placeMines(cells[Math.floor(R/2)*C+Math.floor(C/2)]);
  const rest=cells.filter(c=>!c.open&&!c.mine).sort((a,b)=>Math.hypot(a.x,a.z)-Math.hypot(b.x,b.z));
  const step=Math.min(30,2400/Math.max(1,rest.length));
  rest.forEach((c,k)=>{ if(c.flag){ c.flag=false; flags--; removeFlag(c); } if(c.mark) removeMark(c); c.open=true; opened++; visOpen(c,k*step); });
  let d=0; const t0=rest.length*step/1000;
  cells.forEach(x=>{ if(x.mine&&!x.open){ if(x.mark) removeMark(x); if(!x.flag){ x.flag=true; flags++; } addFlag(x,'pop',t0+0.2+(d++)*0.02); } });
  updLEDs(); addLog(-2,`🤝 大家合力翻開剩下的 ${rest.length} 格`,'sys');
  later(rest.length*step+500,()=>celebrate());
  gLater(rest.length*step+3400,()=>endGame('sweepers','投出叛徒！大家合力清完雷區（派對模式）。',true));
}
function autoSolve(){
  const km=new Set(cells.filter(c=>c.exploded).map(c=>c.i)); let changed=true, nOpen=0, nMine=0;
  while(changed){ changed=false;
    for(const c of cells){ if(!c.open||c.exploded||!c.n) continue;
      const ns=nb(c), unk=ns.filter(x=>!x.open&&!km.has(x.i)); if(!unk.length) continue;
      const k=ns.filter(x=>km.has(x.i)).length;
      if(c.n-k===0){ for(const x of unk){ if(x.open) continue; if(x.flag){ x.flag=false; flags--; removeFlag(x); } nOpen+=revealMany(-1,[x]).opened.length; } changed=true; }
      else if(c.n-k===unk.length){ for(const x of unk){ km.add(x.i); nMine++; if(!x.flag){ x.flag=true; flags++; x.flagBy=-1; if(x.mark) removeMark(x); addFlag(x,'place',0); } } changed=true; }
    } }
  return {nOpen,nMine};
}
function startSprint(){
  G.phase='sprint'; G.tool='reveal'; renderBar(); renderHUD(); renderPlayers();
  const r=started?autoSolve():{nOpen:0,nMine:0};
  addLog(-1,`⚡ 最後衝刺開始！系統自動翻開 ${r.nOpen} 格、標出 ${r.nMine} 個確定的雷`,'sys');
  updLEDs(); setMsg('⚡ 最後衝刺：90 秒內清完雷區！不用輪流，大家一起點。爆炸只扣盾、不開會。');
  if(opened===R*C-M) return endGame('sweepers','投出叛徒，並在最後衝刺中清完雷區（挑戰模式）。');
  startCountdown(90,()=>endGame('traitor','最後衝刺 90 秒用完，雷區沒清完——叛徒反敗為勝！'));
}
function sprintTap(cell,t){
  if(G.phase!=='sprint') return;
  if(t==='flag'){ if(cell.open) return; toggleFlagBy(-2,cell); return; }
  const r=tryReveal(-2,cell); if(r.err) return fail(r.err);
  let tx=r.text; if(r.booms.length) tx+=` 💥 <b class="warn">踩到地雷！防爆盾 -${r.booms.length}（剩 ${G.shields}）</b>`;
  addLog(-2,tx,r.booms.length?'boom':'act',[cell]); updLEDs(); renderShields();
  if(r.booms.length&&G.shields<=0){ stopCountdown(); G.phase='boom'; restoreFace(); gLater(2200,()=>endGame('traitor','最後衝刺中防爆盾歸零——叛徒反敗為勝！')); return; }
  if(opened===R*C-M) endGame('sweepers','投出叛徒，並在最後衝刺中清完雷區（挑戰模式）。');
}

/* ---- 遊戲結束 ---- */
function endGame(winner,reason,skipFx){
  if(!G||G.phase==='end') return;
  G.tok=++TOK; G.phase='end'; G.winner=winner; G.reason=reason; stopCountdown(); over=true;
  secretG.clear(); selG.clear(); hideOv(); hidePeek(); closeModal(); setHover(-1);
  const ti=traitorIdx();
  addLog(-1,`🏁 ${winner==='traitor'?'叛徒獲勝':'掃雷員獲勝'}：${reason}（叛徒是 ${pn(ti)}）`,'sys');
  G.barText=`🏁 ${winner==='traitor'?'😈 叛徒獲勝':'🎉 掃雷員獲勝'}！叛徒是 <span style="color:${players[ti].color}">${esc(players[ti].name)}</span>。<button class="btn" id="barEnd">查看結算 ▶</button>`;
  renderBar(); renderPlayers(); renderHUD(); restoreFace();
  setMsg(`🏁 ${reason}`);
  let delay=1500;
  if(!skipFx){
    if(winner==='traitor'){
      cells.forEach(x=>{ if(x.flag&&!x.mine) addX(x); });
      const last=G.explosions.length?cells[G.explosions[G.explosions.length-1].i]:{x:0,z:0};
      const rest=cells.filter(x=>x.mine&&!x.open&&!x.flag).sort((a,b)=>Math.hypot(a.x-last.x,a.z-last.z)-Math.hypot(b.x-last.x,b.z-last.z));
      const step=Math.min(150,2600/Math.max(1,rest.length));
      rest.forEach((x,k)=>later(300+k*step+rnd(step*0.5),()=>{ vHidden[x.i]=1; updBlock(x.i); addMine(x); explode(x.x,x.z,0.42); }));
      delay=Math.min(4200,1500+rest.length*step);
    } else { let d=0; cells.forEach(x=>{ if(x.mine&&!x.open){ if(x.mark) removeMark(x); if(!x.flag){ x.flag=true; flags++; } addFlag(x,'pop',0.15+(d++)*0.03); } }); updLEDs(); celebrate(); delay=2600; }
  }
  later(delay,showEnd);
}
$('bar').addEventListener('click',e=>{ if(e.target.id==='barEnd') showEnd(); });
function computeScores(){
  const tw=G.winner==='traitor';
  return players.map(p=>{ let s=0; const n=[];
    if(p.role==='traitor'){ if(tw){ s+=3; n.push('獲勝 +3'); } const surv=G.caughtRound||G.round, r=Math.floor(surv/2); if(r){ s+=r; n.push(`撐到第 ${surv} 輪 +${r}`); } if(G.misled){ s+=G.misled; n.push(`誤導隊友踩雷 +${G.misled}`); } }
    else { if(!tw){ s+=3; n.push('獲勝 +3'); } if(p.correct){ s+=p.correct; n.push(`投給叛徒 +${p.correct}`); } if(p.wrong){ s-=p.wrong; n.push(`投錯人 -${p.wrong}`); } if(p.replayHit){ s+=2; n.push('回放查到叛徒痕跡 +2'); } }
    return {s,n}; });
}
function showEnd(){
  if(!G||G.phase!=='end') return;
  const ti=traitorIdx(), t=players[ti], sc=computeScores();
  const sw=players.map((p,i)=>({p,i,v:p.correct+(p.replayHit?2:0)})).filter(o=>o.p.role!=='traitor'&&o.v>0).sort((a,b)=>b.v-a.v);
  const radarN=G.all.filter(e=>e.secret&&e.text.startsWith('📡')).length, swapN=G.all.filter(e=>e.secret&&e.text.startsWith('🔀 偷換旗生效')).length;
  const bm=players.map((p,i)=>({i,b:p.booms})).filter(o=>o.b>0).sort((a,b)=>b.b-a.b);
  let worst='本局沒有人爆炸 👏';

function drawReplay(k,showMines){
  const cv=$('rpCv'); if(!cv) return; const snap=G.snaps[k], e=G.all[k];
  const maxW=Math.min(880,(ovEl.clientWidth||900)-90), cs=Math.max(12,Math.min(26,Math.floor((maxW-18)/C))), pad=16;
  cv.width=C*cs+pad; cv.height=R*cs+pad; const x=cv.getContext('2d');
  x.fillStyle='#c0c0c0'; x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#333'; x.font=`${Math.max(8,Math.min(11,cs*0.5))}px Tahoma,sans-serif`; x.textAlign='center'; x.textBaseline='middle';
  for(let c=0;c<C;c++) if(cs>=16||c%2===0) x.fillText(c+1,pad+c*cs+cs/2,pad/2);
  for(let r=0;r<R;r++) x.fillText(r+1,pad/2,pad+r*cs+cs/2);
  const hl=new Set(e.cells);
  for(const cell of cells){
    const px=pad+cell.c*cs, py=pad+cell.r*cs, code=snap.codes[cell.i];
    if(code===1||code===3){ x.fillStyle=code===3?'#ff2020':'#bdbdbd'; x.fillRect(px,py,cs,cs); x.strokeStyle='#8a8a8a'; x.lineWidth=1; x.strokeRect(px+0.5,py+0.5,cs-1,cs-1);
      if(code===1&&cell.n){ x.fillStyle=NUMC[cell.n]; x.font=`bold ${Math.floor(cs*0.72)}px Arial,sans-serif`; x.fillText(cell.n,px+cs/2,py+cs/2+1); }
      if(code===3){ x.fillStyle='#000'; x.beginPath(); x.arc(px+cs/2,py+cs/2,cs*0.27,0,7); x.fill(); } }
    else { x.fillStyle='#c6c6c6'; x.fillRect(px,py,cs,cs); x.fillStyle='#fff'; x.fillRect(px,py,cs,2); x.fillRect(px,py,2,cs); x.fillStyle='#7b7b7b'; x.fillRect(px,py+cs-2,cs,2); x.fillRect(px+cs-2,py,2,cs);
      if(showMines&&cell.mine&&code!==2){ x.fillStyle='rgba(0,0,0,.35)'; x.beginPath(); x.arc(px+cs/2,py+cs/2,cs*0.22,0,7); x.fill(); }
      if(code===2){ x.fillStyle='#000'; x.fillRect(px+cs*0.55,py+cs*0.16,Math.max(1.5,cs*0.07),cs*0.62); x.fillRect(px+cs*0.28,py+cs*0.72,cs*0.5,cs*0.1); x.fillStyle='#f00'; x.beginPath(); x.moveTo(px+cs*0.6,py+cs*0.12); x.lineTo(px+cs*0.6,py+cs*0.52); x.lineTo(px+cs*0.14,py+cs*0.32); x.closePath(); x.fill();
        if(showMines&&!cell.mine){ x.strokeStyle='#f00'; x.lineWidth=2; x.beginPath(); x.moveTo(px+3,py+3); x.lineTo(px+cs-3,py+cs-3); x.moveTo(px+cs-3,py+3); x.lineTo(px+3,py+cs-3); x.stroke(); } }
      if(code===4||code===5){ x.fillStyle=code===4?'#1aa33a':'#ff7a00'; x.beginPath(); x.arc(px+cs/2,py+cs/2,cs*0.3,0,7); x.fill(); x.fillStyle='#fff'; x.font=`bold ${Math.floor(cs*0.5)}px Arial`; x.fillText(code===4?'✓':'!',px+cs/2,py+cs/2+1); } }
  }
  x.strokeStyle='#ffd400'; x.lineWidth=3; for(const i of hl){ const c=cells[i]; x.strokeRect(pad+c.c*cs+1.5,pad+c.r*cs+1.5,cs-3,cs-3); }
}

let lastT=performance.now(), prevActive=true;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(t-lastT)/1000)); lastT=t; now=t/1000;
  let a=false;
  fire.update(dt); smoke.update(dt); a=fire.alive>0||smoke.alive>0||fire.prev>0||smoke.prev>0;
  a=updDebris(dt)||a; a=updConfetti(dt)||a; a=updRings(dt)||a; a=updLights(dt)||a;
  a=updReveal()||a; a=updJolt(dt)||a; a=updFlagAnims()||a;
  if(trauma>0){ trauma=Math.max(0,trauma-dt*1.25); applyCamera(); a=true; }
  if(a||prevActive||dirty){ renderer.render(scene,camera); dirty=false; }
  prevActive=a;
}

  screenOf(r,c){ const cell=cells[r*C+c]; _v.set(cell.x,cell.open?0:BH,cell.z).project(camera); const rc=canvas.getBoundingClientRect(); return {x:rc.left+(_v.x+1)/2*rc.width,y:rc.top+(1-_v.y)/2*rc.height}; },
  tap(r,c,kind){ onCellTap(cells[r*C+c],kind||'primary'); },
  start(cfg){ startGame(Object.assign({n:5,names:['A','B','C','D','E'],board:'small',turnSec:0,secretSec:0,discussSec:60,voteSec:0,totalMin:0,ending:'party'},cfg||{})); },
  setCountdown(s){ if(CD) CD.left=s; },
  setElapsed(s){ if(G) G.elapsed=s; },
  forceEnd(w,r){ endGame(w||'traitor',r||'debug'); }
};
</script>
