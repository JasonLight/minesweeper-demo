<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>踩地雷 3D｜掃雷企業主</title>
<style>
  :root{--g:#c0c0c0}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#008080;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Tahoma,sans-serif;font-size:13px;color:#000;
       display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .window{background:var(--g);border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;box-shadow:inset 1px 1px #fff,inset -1px -1px #808080;padding:3px;display:inline-flex;flex-direction:column;max-width:100%}
  .title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 3px 3px 6px;display:flex;align-items:center;justify-content:space-between;font-size:13px;white-space:nowrap}
  .tb{display:flex}
  .tbtn{width:16px;height:14px;background:var(--g);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;color:#000;font-size:10px;line-height:11px;text-align:center;margin-left:2px;font-family:Tahoma,sans-serif}
  .menu{display:flex;flex-wrap:wrap;gap:4px;padding:4px 1px;align-items:center}
  .btn,select{font:inherit;background:var(--g);border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:1px 1px 0 #000;padding:1px 8px;color:#000;cursor:pointer;border-radius:0;height:26px;outline:none}
  select{padding:1px 4px}
  .btn:active,.btn.on{border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px 0 #000;background:#b8b8b8}
  .main{border:3px solid;border-color:#fff #808080 #808080 #fff;padding:6px;display:flex;flex-direction:column;gap:6px}
  .sunken{border:3px solid;border-color:#808080 #fff #fff #808080}
  .hud{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
  .led{background:#000;display:flex;padding:2px 1px;border:1px solid;border-color:#808080 #fff #fff #808080}
  .dg{position:relative;width:15px;height:27px;margin:0 1px}
  .dg i{position:absolute;background:#3a0000}
  .dg i.on{background:#ff0000;box-shadow:0 0 3px rgba(255,0,0,.7)}
  .dg i.a,.dg i.g,.dg i.d{left:2px;width:11px;height:3px;clip-path:polygon(2px 0,9px 0,11px 50%,9px 100%,2px 100%,0 50%)}
  .dg i.a{top:0}.dg i.g{top:12px}.dg i.d{top:24px}
  .dg i.f,.dg i.b,.dg i.e,.dg i.c{width:3px;height:11px;clip-path:polygon(50% 0,100% 2px,100% 9px,50% 100%,0 9px,0 2px)}
  .dg i.f{left:0;top:1.5px}.dg i.b{right:0;top:1.5px}.dg i.e{left:0;top:14.5px}.dg i.c{right:0;top:14.5px}
  #face{width:40px;height:40px;font-size:24px;padding:0;line-height:1;background:var(--g);border:3px solid;border-color:#fff #808080 #808080 #fff;outline:1px solid #808080;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  #face:active{border-color:#808080 #fff #fff #808080;padding:2px 0 0 2px}
  #wrap{position:relative;background:radial-gradient(ellipse at 50% 42%,#b4b4b4 0%,#8a8a8a 60%,#6c6c6c 100%);overflow:hidden}
  #c{display:block;touch-action:none;width:300px;height:200px;outline:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#000;font-size:14px;text-align:center;padding:12px}
  .status{display:flex;gap:4px;padding:3px 1px 0;font-size:12px}
  .status span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 6px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #msg{flex:1 1 auto;min-width:0}
  #best{flex:0 1 auto}
  .tip{color:#e8ffff;font-size:12px;text-align:center;margin-top:8px;line-height:1.55;text-shadow:0 1px 0 #004040;max-width:640px}
  @media (max-height:640px){.tip{display:none}}
</style>
</head>
<body>
<div class="window" id="win">
  <div class="title"><span>💣 踩地雷 3D</span><div class="tb"><div class="tbtn">_</div><div class="tbtn">□</div><div class="tbtn">✕</div></div></div>
  <div class="menu">
    <select id="level" aria-label="難度">
      <option value="9,9,10">初級 9×9・10 雷</option>
      <option value="16,16,40">中級 16×16・40 雷</option>
      <option value="16,30,99">高級 16×30・99 雷</option>
    </select>
    <button class="btn" id="flagMode">🚩 插旗模式：關</button>
    <button class="btn" id="sound" title="音效開關" aria-label="音效開關">🔊</button>
    <button class="btn" id="view" title="重設視角" aria-label="重設視角">🎥</button>
  </div>
  <div class="main">
    <div class="hud sunken">
      <div class="led" id="mines" title="剩餘地雷"></div>
      <button id="face" title="重新開始 (F2)">🙂</button>
      <div class="led" id="timer" title="時間"></div>
    </div>
    <div id="wrap" class="sunken"><canvas id="c" tabindex="0"></canvas><div id="loading">載入 3D 引擎中…</div></div>
  </div>
  <div class="status"><span id="msg">&nbsp;</span><span id="best"></span></div>
</div>
<div class="tip" id="tip">左鍵翻開・右鍵插旗・點已翻開的數字（或左右鍵齊按 / 中鍵）可快速翻周圍（旗數對時）<br>
手機：長按插旗，或開啟「插旗模式」・雙指縮放/平移・滾輪縮放・Shift+拖曳旋轉視角・F2 新局</div>

<script>
  // three.js 若無法從 CDN 載入（離線）則顯示提示
  setTimeout(function(){ if(!window.__ms3dReady){ var l=document.getElementById('loading'); if(l) l.textContent='無法載入 three.js（需要網路連線才能使用 3D 版）。'; } }, 10000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基本常數 ================= */
const $ = id => document.getElementById(id);
const BH = 0.36, BEV = 0.09, MAXN = 480;
const NUMC = [null,'#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];
const isTouch = matchMedia('(pointer:coarse)').matches;
const EL = THREE.MathUtils.degToRad(63);           // 預設俯視角（與水平夾角）
const rnd = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
let now = performance.now()/1000;

/* ================= LED 七段顯示 ================= */
const SEG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
function buildLED(el){ el.innerHTML=''; for(let k=0;k<3;k++){ const d=document.createElement('div'); d.className='dg'; for(const s of 'abcdefg'){ const e=document.createElement('i'); e.className=s; d.appendChild(e);} el.appendChild(d);} }
function setLED(el,n){
  n=Math.max(-99,Math.min(999,n|0));
  const s = n<0 ? '-'+String(-n).padStart(2,'0') : String(n).padStart(3,'0');
  [...el.children].forEach((d,k)=>{ const on=SEG[s[k]]||''; [...d.children].forEach(e=>e.classList.toggle('on',on.includes(e.className.replace(' on','')))); });
}
const minesEl=$('mines'), timerEl=$('timer'), faceEl=$('face');
buildLED(minesEl); buildLED(timerEl);
const setFace = f => { if(faceEl.textContent!==f) faceEl.textContent=f; };

/* ================= 音效（WebAudio 合成） ================= */
const Snd={ ctx:null, master:null, noise:null, last:0, muted: localStorage.getItem('ms3d_muted')==='1',
  get(){
    if(this.muted) return null;
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      const c=this.ctx=new AC();
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=8;
      this.master=c.createGain(); this.master.gain.value=0.85; this.master.connect(comp); comp.connect(c.destination);
      const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noise=b;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  boom(p){
    const c=this.get(); if(!c) return; const t=c.currentTime;
    if(p<0.8){ if(t-this.last<0.06) return; this.last=t; }
    const dur=0.45+1.7*p, vol=0.3+0.7*p;
    const n=c.createBufferSource(); n.buffer=this.noise; n.loop=true; n.playbackRate.value=p>0.8?0.7:1.1;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.7;
    lp.frequency.setValueAtTime(1800+3500*p,t); lp.frequency.exponentialRampToValueAtTime(90,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    n.connect(lp).connect(g).connect(this.master); n.start(t,Math.random()); n.stop(t+dur+0.05);
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(p>0.8?95:150,t); o.frequency.exponentialRampToValueAtTime(p>0.8?26:45,t+0.25+0.8*p);
    const og=c.createGain(); og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.2+0.9*p,t+0.012); og.gain.exponentialRampToValueAtTime(0.0001,t+0.35+1.2*p);
    o.connect(og).connect(this.master); o.start(t); o.stop(t+1.8);
    if(p>0.8){ // 碎裂劈啪聲
      for(let k=0;k<6;k++){ const s=c.createBufferSource(); s.buffer=this.noise; const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500+Math.random()*2500;
        const sg=c.createGain(); const st=t+0.08+Math.random()*0.6; sg.gain.setValueAtTime(0.0001,st); sg.gain.exponentialRampToValueAtTime(0.25,st+0.004); sg.gain.exponentialRampToValueAtTime(0.0001,st+0.05+Math.random()*0.06);
        s.connect(hp).connect(sg).connect(this.master); s.start(st,Math.random()); s.stop(st+0.15); }
    }
  },
  tick(){ const c=this.get(); if(!c) return; const t=c.currentTime; const s=c.createBufferSource(); s.buffer=this.noise; const hp=c.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=2200; hp.Q.value=1.5;
    const g=c.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035); s.connect(hp).connect(g).connect(this.master); s.start(t,Math.random()); s.stop(t+0.05); },
  flag(on){ const c=this.get(); if(!c) return; const t=c.currentTime; const o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(on?660:520,t); o.frequency.exponentialRampToValueAtTime(on?990:330,t+0.07);
    const g=c.createGain(); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.1); o.connect(g).connect(this.master); o.start(t); o.stop(t+0.12); },
  win(){ const c=this.get(); if(!c) return; const t=c.currentTime; [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,k)=>{ const o=c.createOscillator(); o.type='square'; o.frequency.value=f;
    const g=c.createGain(); const st=t+k*0.11, d=k===5?0.6:0.1; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.09,st+0.01); g.gain.exponentialRampToValueAtTime(0.0001,st+d);
    o.connect(g).connect(this.master); o.start(st); o.stop(st+d+0.02); }); }
};

/* ================= three.js 場景 ================= */
const canvas=$('c'), wrap=$('wrap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1.5,0.1,600);
scene.add(new THREE.HemisphereLight(0xffffff,0x707070,1.05));
const sun=new THREE.DirectionalLight(0xffffff,2.6);
sun.castShadow=true; sun.shadow.mapSize.set(isTouch?1024:2048,isTouch?1024:2048); sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun,sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2),new THREE.ShadowMaterial({opacity:0.28}));
ground.position.y=-0.52; ground.receiveShadow=true; scene.add(ground);
const dyn=new THREE.Group(); scene.add(dyn);     // 旗子、叉叉等動態物件
let frameGroup=null;

/* ---- 共用幾何 / 材質 ---- */
function bevelBox(w,h,d,bev){ // 斜角方塊（經典凸起按鍵外觀），底部在 y=0
  const hw=w/2-bev, hd=d/2-bev, s=new THREE.Shape();
  s.moveTo(-hw,-hd); s.lineTo(hw,-hd); s.lineTo(hw,hd); s.lineTo(-hw,hd);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.001,h-2*bev),bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:1,curveSegments:1});
  g.rotateX(-Math.PI/2); g.translate(0,bev,0); return g;
}
const blockGeo=bevelBox(0.96,BH,0.96,BEV);
const blockMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.62,metalness:0});
const tileMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9});
const COL={ block:new THREE.Color('#c0c0c0'), hover:new THREE.Color('#d6d6d6'), char:new THREE.Color('#2a241f'), tile:new THREE.Color('#b4b4b4'), red:new THREE.Color('#ff1010') };
const ZERO=new THREE.Matrix4().makeScale(0,0,0);
const _m=new THREE.Matrix4(), _p=new THREE.Vector3(), _s=new THREE.Vector3(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _c=new THREE.Color(), _v=new THREE.Vector3();
const UP=new THREE.Vector3(0,1,0), IDQ=new THREE.Quaternion();

function makeInst(geo,mat,cap,shadow=true){ const m=new THREE.InstancedMesh(geo,mat,cap); m.frustumCulled=false; m.castShadow=shadow; m.receiveShadow=true;
  for(let i=0;i<cap;i++){ m.setMatrixAt(i,ZERO); m.setColorAt(i,COL.block); } m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count=0; scene.add(m); return m; }
const blocks=makeInst(blockGeo,blockMat,MAXN);
const tiles=makeInst(new THREE.BoxGeometry(0.97,0.1,0.97),tileMat,MAXN,false);

// 數字（canvas 貼圖，每個數字一個 InstancedMesh）
function numTex(n){
  const cv=document.createElement('canvas'); cv.width=cv.height=128; const x=cv.getContext('2d');
  x.font='900 112px "Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillText(String(n),69,75);
  x.fillStyle=NUMC[n]; x.fillText(String(n),64,70);
  x.lineWidth=3; x.strokeStyle=NUMC[n]; x.strokeText(String(n),64,70);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
const numGeo=new THREE.PlaneGeometry(0.8,0.8).rotateX(-Math.PI/2);
const numMeshes=[null];
for(let n=1;n<=8;n++){
  const mat=new THREE.MeshStandardMaterial({map:numTex(n),transparent:true,alphaTest:0.05,depthWrite:false,roughness:0.8,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  const m=makeInst(numGeo,mat,MAXN,false); m.renderOrder=1; numMeshes.push(m);
}

// 地雷模型（合併幾何 + InstancedMesh）
const mineGeo=(()=>{ const parts=[new THREE.SphereGeometry(0.22,20,14)];
  const sp=(rx,ry,rz)=>{ const g=new THREE.CylinderGeometry(0.03,0.03,0.68,6); g.rotateX(rx); g.rotateY(ry); g.rotateZ(rz); return g; };
  parts.push(sp(0,0,0),sp(Math.PI/2,0,0),sp(0,0,Math.PI/2),sp(Math.PI/2,Math.PI/4,0),sp(Math.PI/2,-Math.PI/4,0));
  const g=mergeGeometries(parts); g.translate(0,0.25,0); return g; })();
const mineMat=new THREE.MeshStandardMaterial({color:0x151515,roughness:0.3,metalness:0.6});
const mineHiGeo=new THREE.SphereGeometry(0.06,10,8).translate(-0.08,0.38,-0.08);
const mineHiMat=new THREE.MeshBasicMaterial({color:0xffffff});
const mineBody=makeInst(mineGeo,mineMat,MAXN), mineHi=makeInst(mineHiGeo,mineHiMat,MAXN,false);
let mineCount=0;

// 焦痕貼花
function scorchTex(){ const cv=document.createElement('canvas'); cv.width=cv.height=256; const x=cv.getContext('2d');
  for(let k=0;k<26;k++){ const a=rnd(Math.PI*2), r=rnd(0,60), cx=128+Math.cos(a)*r, cy=128+Math.sin(a)*r, rr=rnd(30,80);
    const g=x.createRadialGradient(cx,cy,0,cx,cy,rr); g.addColorStop(0,'rgba(20,14,9,0.22)'); g.addColorStop(1,'rgba(12,9,6,0)'); x.fillStyle=g; x.fillRect(0,0,256,256); }
  const g=x.createRadialGradient(128,128,0,128,128,128); g.addColorStop(0,'rgba(15,10,6,0.6)'); g.addColorStop(0.4,'rgba(25,17,10,0.4)'); g.addColorStop(1,'rgba(25,17,10,0)');
  x.fillStyle=g; x.fillRect(0,0,256,256); const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t; }
const scorchMesh=makeInst(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({map:scorchTex(),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}),MAXN,false);
let scorchCount=0;

// 旗子模型（黑色底座+旗桿合併，紅色三角旗）
const flagBaseGeo=mergeGeometries([new THREE.BoxGeometry(0.36,0.045,0.22).translate(0,0.0225,0),new THREE.BoxGeometry(0.2,0.045,0.13).translate(0,0.0675,0)]);
const flagPoleGeo=new THREE.BoxGeometry(0.05,0.72,0.05).translate(0.06,0.36,0);
const flagClothGeo=(()=>{ const s=new THREE.Shape(); s.moveTo(0.05,0.72); s.lineTo(0.05,0.3); s.lineTo(-0.38,0.51);
  const g=new THREE.ExtrudeGeometry(s,{depth:0.04,bevelEnabled:false}); g.translate(0,0,-0.02); return g; })();
const flagBlackMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.5});
const flagRedMat=new THREE.MeshStandardMaterial({color:0xff0000,roughness:0.55,emissive:0x330000});
function makeFlag(){ // 底座平放；旗桿+旗面依視線方向傾斜（正上方俯視時仍看得清楚）
  const g=new THREE.Group(), inner=new THREE.Group(); inner.position.y=0.09;
  const base=new THREE.Mesh(flagBaseGeo,flagBlackMat), pole=new THREE.Mesh(flagPoleGeo,flagBlackMat), cloth=new THREE.Mesh(flagClothGeo,flagRedMat);
  base.castShadow=pole.castShadow=cloth.castShadow=true; inner.add(pole,cloth); g.add(base,inner); g.userData.inner=inner; g.userData.spin=0; g.scale.setScalar(1.1); return g; }
function orientFlag(g){ const dx=camera.position.x-g.position.x, dz=camera.position.z-g.position.z, dy=camera.position.y-g.position.y;
  g.rotation.y=Math.atan2(dx,dz)+(g.userData.spin||0); g.userData.inner.rotation.x=-Math.atan2(dy,Math.hypot(dx,dz))*0.55; }
function orientFlags(){ for(const o of dyn.children) if(o.userData.inner) orientFlag(o); }
// 錯誤旗號的紅色 X
const xGeo=mergeGeometries([new THREE.BoxGeometry(0.8,0.06,0.1).rotateY(Math.PI/4),new THREE.BoxGeometry(0.8,0.06,0.1).rotateY(-Math.PI/4)]);
const xMat=new THREE.MeshBasicMaterial({color:0xff0000});

/* ---- 粒子系統（自訂 shader，單一 draw call） ---- */
function softTex(kind){ const S=128, cv=document.createElement('canvas'); cv.width=cv.height=S; const x=cv.getContext('2d');

const raycaster=new THREE.Raycaster(), _ndc=new THREE.Vector2(), _t=new THREE.Vector3(), plane0=new THREE.Plane(new THREE.Vector3(0,1,0),0), _box=new THREE.Box3(), _hit=new THREE.Vector3();

    if(it===3) break;

    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const c of corners){ _v.copy(c).project(camera); x0=Math.min(x0,_v.x); x1=Math.max(x1,_v.x); y0=Math.min(y0,_v.y); y1=Math.max(y1,_v.y); }

    _t.x+=s*(Math.sin(tt*1.13)+Math.sin(tt*2.31+1))*0.5; _t.z+=s*(Math.sin(tt*1.71+2)+Math.sin(tt*2.93))*0.5; _t.y+=s*Math.sin(tt*2.07+4)*0.35; }

function layout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const rot = vw<vh*0.95 && C>R;              // 直式手機：高級盤面轉 90°
  const az = rot?Math.PI/2:0;
  const bw=(rot?R:C)+1.3, bh=(rot?C:R)+1.3, aspect=bw/(bh*0.94+0.4);
  const tip=$('tip'), win=$('win');
  for(let pass=0;pass<2;pass++){
    const chromeW=win.offsetWidth-canvas.offsetWidth, chromeH=win.offsetHeight-canvas.offsetHeight;
    const tipH=tip.offsetHeight?tip.offsetHeight+8:0;
    const availW=vw-16-Math.min(chromeW,40), availH=vh-16-chromeH-tipH;
    let w=Math.min(availW,bw*(isTouch?72:56),Math.max(availH,180)*aspect); w=Math.max(220,Math.floor(w));
    const h=Math.max(150,Math.floor(w/aspect));
    renderer.setSize(w,h); canvas.style.width=w+'px'; canvas.style.height=h+'px';
  }
  camera.aspect=canvas.clientWidth/canvas.clientHeight; camera.updateProjectionMatrix();
  const db=renderer.getDrawingBufferSize(new THREE.Vector2());
  const sc=db.y/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)); particleMats.forEach(m=>m.uniforms.uScale.value=sc);
  if(az!==view.baseAz){ view.baseAz=az; refreshOrientation(); }
  fitCamera(); resetView();
}

  touches.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(touches.size===1){
    touchMoved=false; touchConsumed=false; gesture=false;
    const cell=pick(e.clientX,e.clientY); setPress(cell,false);
    clearTimeout(longT);
    if(cell&&!over) longT=setTimeout(()=>{ longT=null; if(touchMoved||gesture) return; touchConsumed=true; endPress();
      if(!cell.open){ toggleFlag(cell); if(navigator.vibrate) navigator.vibrate(25); } },430);
  } else if(touches.size===2){ gesture=true; clearTimeout(longT); longT=null; endPress(); pinch=pinchState(); }
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!touches.has(e.pointerId)) return;
  lastTouch=Date.now(); const t=touches.get(e.pointerId); t.x=e.clientX; t.y=e.clientY;
  if(gesture&&touches.size>=2&&pinch){
    const ps=pinchState(), P=groundHit(pinch.mx,pinch.my);
    view.zoom=clamp(view.zoom*pinch.d/ps.d,0.3,1.6); applyCamera();
    const P2=groundHit(ps.mx,ps.my); if(P&&P2){ view.target.add(P.sub(P2)); clampTarget(); } applyCamera(); pinch=ps; return;
  }
  if(!touchMoved&&Math.hypot(t.x-t.sx,t.y-t.sy)>12){ touchMoved=true; clearTimeout(longT); longT=null; endPress(); }
},{passive:false});
function touchEnd(e,cancel){
  if(e.pointerType!=='touch'||!touches.has(e.pointerId)) return;
  lastTouch=Date.now(); touches.delete(e.pointerId);
  if(gesture){ if(touches.size===0) gesture=false; else if(touches.size===1) pinch=null; return; }
  clearTimeout(longT); longT=null;
  const cell=press?press.cell:null; endPress();
  if(cancel||touchConsumed||touchMoved||!cell) return;
  if(flagMode&&!cell.open) toggleFlag(cell); else click(cell);
}
canvas.addEventListener('pointerup',e=>touchEnd(e,false));
canvas.addEventListener('pointercancel',e=>touchEnd(e,true));

/* ================= UI 按鈕 ================= */
faceEl.onclick=init; $('level').onchange=()=>{ init(); $('level').blur(); };
$('flagMode').onclick=()=>{ flagMode=!flagMode; $('flagMode').textContent=`🚩 插旗模式：${flagMode?'開':'關'}`; $('flagMode').classList.toggle('on',flagMode); };
const updSoundBtn=()=>{ $('sound').textContent=Snd.muted?'🔇':'🔊'; $('sound').title=Snd.muted?'已靜音（點擊開啟音效）':'音效開啟（點擊靜音）'; };
$('sound').onclick=()=>{ Snd.muted=!Snd.muted; localStorage.setItem('ms3d_muted',Snd.muted?'1':'0'); updSoundBtn(); if(!Snd.muted) Snd.flag(true); };
$('view').onclick=()=>resetView();
window.addEventListener('keydown',e=>{ if(e.key==='F2'){ e.preventDefault(); init(); } });
updSoundBtn();
if(isTouch) $('tip').innerHTML='點一下翻開・長按插旗（或開啟「插旗模式」）・點數字快速翻周圍<br>雙指縮放 / 平移・🎥 重設視角';

/* ================= 主迴圈 ================= */
let lastT=performance.now(), prevActive=true;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(t-lastT)/1000)); lastT=t; now=t/1000;
  let a=false;
  fire.update(dt); smoke.update(dt); a=fire.alive>0||smoke.alive>0||fire.prev>0||smoke.prev>0;
  a=updDebris(dt)||a; a=updConfetti(dt)||a; a=updRings(dt)||a; a=updLights(dt)||a;
  a=updReveal()||a; a=updJolt(dt)||a; a=updFlagAnims()||a;
  if(trauma>0){ trauma=Math.max(0,trauma-dt*1.25); applyCamera(); a=true; }
  if(a||prevActive||dirty){ renderer.render(scene,camera); dirty=false; }
  prevActive=a;
}
$('loading').remove();
init();
requestAnimationFrame(frame);
window.__ms3dReady=true;

// 測試/除錯用掛鉤（不影響遊戲）
window.__ms3d={ get cells(){return cells;}, get over(){return over;}, get started(){return started;},
  screenOf(r,c){ const cell=cells[r*C+c]; _v.set(cell.x,cell.open?0:BH,cell.z).project(camera); const rc=canvas.getBoundingClientRect(); return {x:rc.left+(_v.x+1)/2*rc.width,y:rc.top+(1-_v.y)/2*rc.height}; } };
</script>
